# One service; pick the command at run time, using the same workflow presets
# CI and local builds use, e.g.:
#
#   docker compose run --rm embedded-cpp-dev cmake --workflow --preset host-debug
#
# UID/GID must be exported explicitly (bash does not export its UID variable):
#
#   UID="$(id -u)" GID="$(id -g)" docker compose run --rm embedded-cpp-dev ...
#
# The 1000:1000 fallback matches the image's vscode user, which is also the
# common first-user id on Linux desktops.
services:
  embedded-cpp-dev:
    build:
      context: .
      dockerfile: Dockerfile
    image: embedded-cpp-docker:latest
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - .:/home/vscode/workspace
    working_dir: /home/vscode/workspace
