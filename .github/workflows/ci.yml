name: CI

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
  workflow_dispatch:

# Cancel superseded runs on the same branch/PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host-build-test:
    name: Host Build & Test (Debug)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Pin to clang-format-18 to match the version in the dev container
      # (Dockerfile aliases clang-format -> clang-format-18). An unpinned
      # clang-format can disagree with local formatting.
      - name: Install clang-format
        run: sudo apt-get update && sudo apt-get install -y clang-format-18

      # uv resolves ruff/mypy/Python from py/host-emulator/uv.lock and
      # .python-version, so CI runs the exact versions the container does.
      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: py/host-emulator/uv.lock

      # The same script the pre-commit hook and the `format-check` CMake target
      # run. Sharing one implementation is the point: a local check that has
      # drifted from CI is worse than no local check, because it is trusted.
      - name: Check formatting
        run: |
          if ! tools/format.sh --check; then
            echo "::error::Formatting errors. Fix with: tools/format.sh --fix"
            exit 1
          fi

      # Not part of format.sh: type checking is not a formatting concern, and is
      # too slow to belong in a commit hook.
      - name: Type-check Python
        working-directory: py/host-emulator
        run: |
          if ! uv run --frozen mypy; then
            echo "::error::Python type errors. Reproduce with: uv run mypy"
            exit 1
          fi

      # Build with a registry-independent GHA layer cache so the apt/toolchain
      # layers are not rebuilt on every run.
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build dev image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: embedded-cpp-docker:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Run as the runner's own uid/gid so everything written into the mounted
      # checkout is owned by the runner: no root-then-chown repair needed. The
      # CI compose overlay mounts the checkout where a non-1000 uid can reach
      # it and gives uv a writable HOME (see docker-compose.ci.yml).
      - name: Run host-debug workflow
        run: >
          docker compose -f docker-compose.yml -f docker-compose.ci.yml run --rm
          --user "$(id -u):$(id -g)" embedded-cpp-dev
          cmake --workflow --preset host-debug

      - name: Generate coverage reports
        run: >
          docker compose -f docker-compose.yml -f docker-compose.ci.yml run --rm
          --user "$(id -u):$(id -g)" embedded-cpp-dev
          cmake --build build/host --config Debug --target ccov-all

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            build/host/Testing/**/*.xml
            build/host/Testing/**/*.log
          if-no-files-found: ignore

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: |
            build/host/ccov/**/*
          if-no-files-found: ignore

  arm-cross-build:
    name: ARM Cross-Build (Nucleo F767ZI)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # The same image, and the same GHA cache the host job populates, so the
      # apt/toolchain layers are a cache hit rather than a second build.
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build dev image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: embedded-cpp-docker:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Both configurations, deliberately. Release is the one that matters
      # here: -Os -flto with --gc-sections is where a missing KEEP on the
      # vector table or a garbage-collected weak interrupt handler shows up,
      # and neither is visible in a Debug build.
      - name: Cross-build (Debug)
        run: >
          docker compose -f docker-compose.yml -f docker-compose.ci.yml run --rm
          --user "$(id -u):$(id -g)" embedded-cpp-dev
          cmake --workflow --preset nucleo-f767zi-debug

      - name: Cross-build (Release)
        run: >
          docker compose -f docker-compose.yml -f docker-compose.ci.yml run --rm
          --user "$(id -u):$(id -g)" embedded-cpp-dev
          cmake --workflow --preset nucleo-f767zi-release

      # Everything about a firmware image that can be checked without a board:
      # the vector table's address, the entry point and its Thumb bit, a
      # non-empty .init_array, no undefined symbols, and no allocation on the
      # interrupt-handler paths. Same script a developer runs locally.
      - name: Verify firmware images
        run: >
          docker compose -f docker-compose.yml -f docker-compose.ci.yml run --rm
          --user "$(id -u):$(id -g)" embedded-cpp-dev
          tools/verify-firmware.sh build/nucleo-f767zi

      # Recorded, not gated. A size budget is worth having once there are
      # enough data points to know what normal looks like; picking a threshold
      # now would only be a number to argue with.
      - name: Firmware size report
        run: >
          docker compose -f docker-compose.yml -f docker-compose.ci.yml run --rm
          --user "$(id -u):$(id -g)" embedded-cpp-dev
          sh -c 'arm-none-eabi-size -A build/nucleo-f767zi/bin/*/*.elf'

      - name: Upload firmware
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: firmware-nucleo-f767zi
          path: |
            build/nucleo-f767zi/bin/**/*.elf
            build/nucleo-f767zi/bin/**/*.bin
            build/nucleo-f767zi/bin/**/*.hex
            build/nucleo-f767zi/**/*.map
          if-no-files-found: ignore
