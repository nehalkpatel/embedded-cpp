name: CI

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
  workflow_dispatch:

# Cancel superseded runs on the same branch/PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host-build-test:
    name: Host Build & Test (Debug)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Pin to clang-format-18 to match the version in the dev container
      # (Dockerfile aliases clang-format -> clang-format-18). An unpinned
      # clang-format can disagree with local formatting.
      - name: Install clang-format
        run: sudo apt-get update && sudo apt-get install -y clang-format-18

      # uv resolves ruff/mypy/Python from py/host-emulator/uv.lock and
      # .python-version, so CI runs the exact versions the container does.
      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: py/host-emulator/uv.lock

      # The same script the pre-commit hook and the `format-check` CMake target
      # run. Sharing one implementation is the point: a local check that has
      # drifted from CI is worse than no local check, because it is trusted.
      - name: Check formatting
        run: |
          if ! tools/format.sh --check; then
            echo "::error::Formatting errors. Fix with: tools/format.sh --fix"
            exit 1
          fi

      # Not part of format.sh: type checking is not a formatting concern, and is
      # too slow to belong in a commit hook.
      - name: Type-check Python
        working-directory: py/host-emulator
        run: |
          if ! uv run --frozen mypy; then
            echo "::error::Python type errors. Reproduce with: uv run mypy"
            exit 1
          fi

      # Build with a registry-independent GHA layer cache so the apt/toolchain
      # layers are not rebuilt on every run.
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build dev image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: embedded-cpp-docker:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Run as the runner's own uid/gid so everything written into the mounted
      # checkout is owned by the runner: no root-then-chown repair needed. The
      # CI compose overlay mounts the checkout where a non-1000 uid can reach
      # it and gives uv a writable HOME (see docker-compose.ci.yml).
      - name: Run host-debug workflow
        run: >
          docker compose -f docker-compose.yml -f docker-compose.ci.yml run --rm
          --user "$(id -u):$(id -g)" embedded-cpp-dev
          cmake --workflow --preset host-debug

      - name: Generate coverage reports
        run: >
          docker compose -f docker-compose.yml -f docker-compose.ci.yml run --rm
          --user "$(id -u):$(id -g)" embedded-cpp-dev
          cmake --build build/host --config Debug --target ccov-all

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            build/host/Testing/**/*.xml
            build/host/Testing/**/*.log
          if-no-files-found: ignore

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: |
            build/host/ccov/**/*
          if-no-files-found: ignore
