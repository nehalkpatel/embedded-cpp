[project]
name = "host-emulator"
version = "0.1.0"
description = "Host emulator for embedded C++ applications"
authors = [{ name = "Nehal Patel", email = "hereisnehal@gmail.com" }]
readme = "README.md"
requires-python = ">=3.14"
dependencies = ["pyzmq>=27"]

# PEP 735 dependency group. uv syncs this by default, so `uv run pytest` works
# without extra flags (unlike an optional-dependencies extra).
[dependency-groups]
dev = ["pytest>=9", "pytest-cov>=7", "ruff>=0.14", "mypy>=1.19"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/host_emulator"]

[tool.ruff]
line-length = 88
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # Pyflakes
    "I",     # isort
    "B",     # flake8-bugbear
    "C4",    # flake8-comprehensions
    "UP",    # pyupgrade
    "ARG",   # flake8-unused-arguments
    "SIM",   # flake8-simplify
    "TC",    # flake8-type-checking
    "PTH",   # flake8-use-pathlib
    "RUF",   # Ruff-specific rules
]
ignore = [
    "E501",  # line too long (handled by formatter)
]

[tool.ruff.lint.isort]
known-first-party = ["host_emulator"]

[tool.mypy]
python_version = "3.14"
# `strict` already implies warn_return_any, warn_unused_ignores,
# disallow_untyped_defs/decorators, disallow_incomplete_defs, check_untyped_defs,
# no_implicit_optional, warn_redundant_casts and warn_unused_configs.
strict = true

[[tool.mypy.overrides]]
module = ["zmq.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
